name: Set up iOS build environment
description: >
  Installs the toolchain (Xcode, Node, Ruby, ccache) and restores every build
  cache (node_modules, ccache, CocoaPods) needed to compile the iOS app.
  Extracted into a composite action so the TestFlight, release and screenshot
  jobs cannot drift apart — in particular the ordering requirement that ccache
  is installed before `pod install` runs.

inputs:
  ccache-key-prefix:
    description: >
      Cache key namespace for the compiler cache. Jobs that compile for
      different SDKs must use different prefixes: two jobs in the same workflow
      run cannot write the same cache key, so sharing one would mean only the
      first job's objects are ever kept.
    required: false
    default: ccache-ios-device
  ccache-max-size:
    description: Upper bound on the ccache directory.
    required: false
    default: 2G
  backend-api-key:
    description: >
      Backend API key for fticoachcharters.com. Written to the gitignored
      Config.js before building; the app imports API_KEY from it. Provide as a
      GitHub Actions secret — never commit the value.
    required: true

runs:
  using: composite
  steps:
    # Constrained rather than `latest-stable`: a compiler change invalidates
    # every ccache entry, so Xcode upgrades should be deliberate. `^26` means
    # the newest Xcode 26.x on the image, which keeps the App Store SDK
    # requirement satisfied without breaking when GitHub retires a minor.
    # Narrow this to an exact version (e.g. '26.3') for full cache stability.
    - name: Select Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '^26'

    - name: Set up Node
      uses: actions/setup-node@v5
      with:
        node-version: 24
        cache: npm

    - name: Cache node_modules
      id: node-modules
      uses: actions/cache@v5
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

    - name: Install JS dependencies
      if: steps.node-modules.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci

    # The app imports API_KEY from the gitignored Config.js (repo root), which
    # Metro needs at bundle time. Generate it from the repository secret here so
    # the key never lives in version control. The value is passed via env (never
    # interpolated into the shell) and JSON.stringify safely quotes/escapes it,
    # so special characters in the key cannot break the file or the build.
    - name: Generate Config.js from backend API key
      shell: bash
      env:
        BACKEND_API_KEY: ${{ inputs.backend-api-key }}
      run: |
        node -e 'const fs = require("fs"); const k = process.env.BACKEND_API_KEY; if (!k) { console.error("::error::BACKEND_API_KEY is empty; set the BACKEND_API_KEY repository secret"); process.exit(1); } fs.writeFileSync("Config.js", `export const API_KEY = ${JSON.stringify(k)};\n`);'

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'
        bundler-cache: true

    # ccache must exist *before* `pod install`: React Native only injects the
    # ccache compiler wrappers into the generated Pods project if
    # `command -v ccache` succeeds while that project is being generated
    # (node_modules/react-native/scripts/cocoapods/utils.rb). USE_CCACHE is
    # what react_native_post_install reads to decide whether to do so. If the
    # wrapper is not injected, the build still succeeds but nothing is cached —
    # so also put ccache on PATH explicitly (in case `bundle exec` runs with a
    # trimmed PATH that does not include the Homebrew bin dir) and verify below
    # that it actually got wired into the Pods project.
    #
    # IMPORTANT: prepend a directory containing only a symlink to ccache, not
    # Homebrew's whole bin dir. GITHUB_PATH entries are prepended (the last
    # write wins the front), so adding `$(dirname ccache)` (i.e.
    # /opt/homebrew/bin) here would push Homebrew's Ruby 3.4.0 ahead of the
    # Ruby 3.3 that ruby/setup-ruby installed in the previous step, and every
    # later `bundle exec pod install` / `bundle exec fastlane` would run under
    # 3.4.0 where the installed gems don't exist ("Could not find …").
    #
    # Xcode 26 CompileC does not export user-defined build settings as env
    # vars, so RN's wrappers see an empty CCACHE_BINARY and `exec` plain clang
    # (facebook/react-native#55381). The cache dir is then never created and
    # `actions/cache` logs "Path Validation Error". Rewrite the wrappers to
    # call the binary resolved here, and mkdir the cache dir so a save is
    # still valid even on a compile that produces no objects.
    - name: Install ccache
      shell: bash
      env:
        # Without this, `brew install` can spend minutes updating itself.
        HOMEBREW_NO_AUTO_UPDATE: '1'
        HOMEBREW_NO_INSTALL_CLEANUP: '1'
      run: |
        command -v ccache >/dev/null 2>&1 || brew install ccache
        real_ccache="$(command -v ccache)"
        cache_dir="$HOME/Library/Caches/ccache"
        mkdir -p "$HOME/.local/bin" "$cache_dir"
        ln -sf "$real_ccache" "$HOME/.local/bin/ccache"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        {
          echo "USE_CCACHE=1"
          echo "CCACHE_DIR=$cache_dir"
          echo "CCACHE_MAXSIZE=${{ inputs.ccache-max-size }}"
        } >> "$GITHUB_ENV"

        python3 <<PY
        from pathlib import Path
        cache_dir = "$cache_dir"
        real = "$real_ccache"
        maxsize = "${{ inputs.ccache-max-size }}"
        base = Path("node_modules/react-native/scripts/xcode")
        for name, compiler in [("ccache-clang.sh", "clang"), ("ccache-clang++.sh", "clang++")]:
            path = base / name
            if not path.is_file():
                raise SystemExit(f"missing RN ccache wrapper {path}")
            path.write_text(
                "#!/bin/sh\n"
                "SCRIPT_DIR=\"\$(CDPATH= cd -- \"\$(dirname \"\$0\")\" && pwd)\"\n"
                "export CCACHE_CONFIGPATH=\"\${CCACHE_CONFIGPATH:-\$SCRIPT_DIR/ccache.conf}\"\n"
                f"export CCACHE_DIR=\"{cache_dir}\"\n"
                f"export CCACHE_MAXSIZE=\"{maxsize}\"\n"
                f"exec \"{real}\" {compiler} \"\$@\"\n"
            )
            path.chmod(0o755)
        PY

    # The key rotates per commit so the cache is re-saved every run (a fixed
    # key would only ever be written once); restore-keys pulls the newest
    # previous cache.
    - name: Cache ccache
      uses: actions/cache@v5
      with:
        path: ~/Library/Caches/ccache
        key: ${{ inputs.ccache-key-prefix }}-${{ github.sha }}
        restore-keys: |
          ${{ inputs.ccache-key-prefix }}-

    # Keyed on Podfile.lock (the resolved graph) so an exact hit means the
    # cached Pods dir matches the lockfile. No restore-keys: a partial match
    # would restore a Pods dir that does not match the lockfile. The workspace
    # is generated by `pod install` and is not committed, so it has to be
    # cached too. The codegen output (ios/build/generated/ios) is also produced
    # by `pod install` — it is where the ReactCodegen /
    # ReactAppDependencyProvider pod sources live — and is gitignored, so it
    # must be cached or a fresh runner builds against missing generated
    # sources. Even on a hit, pod install still runs (see below): the cache
    # only avoids re-downloading the dependency graph, not the user-project
    # integration step.
    - name: Cache CocoaPods
      id: pods
      uses: actions/cache@v5
      with:
        path: |
          ios/Pods
          ios/fti_coach.xcworkspace
          ios/build/generated
          ~/Library/Caches/CocoaPods
        key: pods-v4-${{ runner.os }}-${{ hashFiles('ios/Podfile', 'ios/Podfile.lock', 'package-lock.json') }}

    # pod install MUST run on every job, cache hit or not. The committed app
    # project (ios/fti_coach.xcodeproj) has no PBXTargetDependency on the
    # Pods-fti_coach aggregate — CocoaPods only adds that dependency while
    # integrating the user project during `pod install`. If pod install is
    # skipped on a cache hit, the aggregate target is missing from Xcode's
    # dependency graph, libPods-fti_coach.a is never built and the app link
    # fails with "ld: library 'Pods-fti_coach' not found". The cache still
    # pays off: with ios/Pods and ~/Library/Caches/CocoaPods restored, pod
    # install only re-writes the projects (~1-2 min) instead of re-downloading
    # the whole dependency graph.
    - name: Install CocoaPods dependencies
      shell: bash
      working-directory: ios
      run: bundle exec pod install

    # ccache silently dropping out is expensive (every compile from scratch)
    # and easy to miss — it only shows up as an empty cache dir and slow runs.
    # Fail the job instead so a missing injection is visible immediately.
    - name: Verify ccache is wired into the Pods project
      shell: bash
      run: |
        if grep -q 'ccache-clang.sh' ios/Pods/Pods.xcodeproj/project.pbxproj; then
          echo "ccache compiler wrapper is wired into the Pods project"
        else
          echo "::error::ccache was not injected into the Pods project; compiles will not be cached. Check that 'command -v ccache' succeeds during 'pod install'."
          exit 1
        fi
