name: Set up iOS build environment
description: >
  Installs the toolchain (Xcode, Node, Ruby, ccache) and restores every build
  cache (node_modules, ccache, CocoaPods) needed to compile the iOS app.
  Extracted into a composite action so the TestFlight, release and screenshot
  jobs cannot drift apart — in particular the ordering requirement that ccache
  is installed before `pod install` runs.

inputs:
  ccache-key-prefix:
    description: >
      Cache key namespace for the compiler cache. Jobs that compile for
      different SDKs must use different prefixes: two jobs in the same workflow
      run cannot write the same cache key, so sharing one would mean only the
      first job's objects are ever kept.
    required: false
    default: ccache-ios-device
  ccache-max-size:
    description: Upper bound on the ccache directory.
    required: false
    default: 2G

runs:
  using: composite
  steps:
    # Constrained rather than `latest-stable`: a compiler change invalidates
    # every ccache entry, so Xcode upgrades should be deliberate. `^26` means
    # the newest Xcode 26.x on the image, which keeps the App Store SDK
    # requirement satisfied without breaking when GitHub retires a minor.
    # Narrow this to an exact version (e.g. '26.3') for full cache stability.
    - name: Select Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '^26'

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: npm

    - name: Cache node_modules
      id: node-modules
      uses: actions/cache@v4
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

    - name: Install JS dependencies
      if: steps.node-modules.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'
        bundler-cache: true

    # ccache must exist *before* `pod install`: React Native only injects the
    # ccache compiler wrappers into the generated Pods project if
    # `command -v ccache` succeeds while that project is being generated
    # (node_modules/react-native/scripts/cocoapods/utils.rb). USE_CCACHE is
    # what react_native_post_install reads to decide whether to do so.
    - name: Install ccache
      shell: bash
      env:
        # Without this, `brew install` can spend minutes updating itself.
        HOMEBREW_NO_AUTO_UPDATE: '1'
        HOMEBREW_NO_INSTALL_CLEANUP: '1'
      run: |
        command -v ccache || brew install ccache
        {
          echo "USE_CCACHE=1"
          echo "CCACHE_DIR=$HOME/Library/Caches/ccache"
          echo "CCACHE_MAXSIZE=${{ inputs.ccache-max-size }}"
        } >> "$GITHUB_ENV"

    # The key rotates per commit so the cache is re-saved every run (a fixed
    # key would only ever be written once); restore-keys pulls the newest
    # previous cache.
    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: ~/Library/Caches/ccache
        key: ${{ inputs.ccache-key-prefix }}-${{ github.sha }}
        restore-keys: |
          ${{ inputs.ccache-key-prefix }}-

    # Keyed on Podfile.lock (the resolved graph) so an exact hit means the
    # cached Pods dir is authoritative and `pod install` can be skipped
    # entirely. No restore-keys: a partial match would restore a Pods dir that
    # does not match the lockfile. The workspace is generated by `pod install`
    # and is not committed, so it has to be cached too. The codegen output
    # (ios/build/generated/ios) is also produced by `pod install` — it is where
    # the ReactCodegen / ReactAppDependencyProvider pod sources live — and is
    # gitignored, so it must be cached or a cache hit builds against missing
    # generated sources.
    - name: Cache CocoaPods
      id: pods
      uses: actions/cache@v4
      with:
        path: |
          ios/Pods
          ios/fti_coach.xcworkspace
          ios/build/generated
          ~/Library/Caches/CocoaPods
        key: pods-v3-${{ runner.os }}-${{ hashFiles('ios/Podfile', 'ios/Podfile.lock', 'package-lock.json') }}

    # A restored Pods project hardcodes the absolute path to the ccache binary
    # that existed when it was generated. If a runner image ever moves it, the
    # compile would fail with "command not found"; regenerate instead.
    - name: Check cached Pods project is still usable
      id: pods-check
      if: steps.pods.outputs.cache-hit == 'true'
      shell: bash
      run: |
        binary=$(sed -n 's/.*CCACHE_BINARY = "\{0,1\}\([^";]*\)"\{0,1\};.*/\1/p' \
          ios/Pods/Pods.xcodeproj/project.pbxproj | head -1)
        if [ -n "$binary" ] && [ ! -x "$binary" ]; then
          echo "ccache moved from $binary; regenerating the Pods project"
          echo "stale=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Install CocoaPods dependencies
      if: steps.pods.outputs.cache-hit != 'true' || steps.pods-check.outputs.stale == 'true'
      shell: bash
      working-directory: ios
      run: bundle exec pod install
