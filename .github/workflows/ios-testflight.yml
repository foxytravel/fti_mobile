name: iOS TestFlight

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two uploads at once: build numbers are derived from the latest
# TestFlight build number.
concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  testflight:
    name: Build and upload to TestFlight
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up iOS build environment
        uses: ./.github/actions/setup-ios-build
        with:
          # Device (iphoneos) objects — shared with the release workflow's
          # build job, which compiles exactly the same configuration.
          ccache-key-prefix: ccache-ios-device

      # Read-only deploy key used by fastlane match to clone the private
      # certificates repo over SSH.
      - name: Load certificates repo deploy key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.CERTS_DEPLOY_KEY }}

      - name: Build and upload to TestFlight
        run: bundle exec fastlane ios beta
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}

      # Hit rate should settle well above 90% on runs that do not touch native
      # code; a sudden drop means something invalidated the cache (Xcode
      # upgrade, RN version bump, changed compiler flags).
      - name: Report ccache statistics
        if: always()
        run: ccache --show-stats --verbose || true

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcode-build-log
          path: ~/Library/Logs/gym/*.log
          if-no-files-found: ignore
