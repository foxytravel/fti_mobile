name: iOS App Store Release

# Manually triggered: bumps the marketing version, builds, uploads, captures
# the App Store screenshots and submits the app for review. The version bump
# is committed back to the repository and tagged (vX.Y.Z).
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type (ignored when an explicit version is given)
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: 'Explicit version (e.g. 1.2.0). Leave empty to use the bump type.'
        type: string
        required: false
      submit_for_review:
        description: 'Submit for App Store review after uploading. Set to false to do a dry run (build + screenshots uploaded, no submission).'
        type: boolean
        default: true

concurrency:
  group: ios-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build, capture screenshots, upload and submit for review
    runs-on: macos-26
    timeout-minutes: 120
    env:
      # Makes react_native_post_install wire the Pods targets' CC/CXX up to
      # ccache (see node_modules/react-native/scripts/cocoapods/utils.rb).
      # Read at `pod install` time, so it must be set for that step too.
      USE_CCACHE: '1'
      # Larger than the TestFlight job: this lane compiles the whole dependency
      # graph twice (the device archive, then the simulator build that drives
      # the screenshots), so both sets of objects have to fit without eviction.
      CCACHE_MAXSIZE: 3G
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the release commit/tag can be pushed back.
          fetch-depth: 0

      # Constrained rather than `latest-stable`: a compiler change invalidates
      # every ccache entry, so Xcode upgrades should be deliberate. `^26` means
      # the newest Xcode 26.x on the image, which keeps the App Store SDK
      # requirement satisfied without breaking when GitHub retires a minor.
      # Narrow this to an exact version (e.g. '26.3') for full cache stability.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '^26'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install JS dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      # ccache must exist *before* `pod install`: React Native only injects the
      # ccache compiler wrappers into the generated Pods project if
      # `command -v ccache` succeeds while the project is being generated.
      - name: Install ccache
        env:
          # Without this, `brew install` can spend minutes updating itself.
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          command -v ccache || brew install ccache
          echo "CCACHE_DIR=$HOME/Library/Caches/ccache" >> "$GITHUB_ENV"

      # Shares the `ccache-ios-` prefix with the TestFlight workflow so a
      # release reuses the objects already compiled by the last main build.
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ccache
          key: ccache-ios-${{ github.sha }}
          restore-keys: |
            ccache-ios-

      # Keyed on Podfile.lock (the resolved graph) so an exact hit means the
      # cached Pods dir is authoritative and `pod install` can be skipped
      # entirely. No restore-keys: a partial match would restore a Pods dir
      # that does not match the lockfile. The workspace is generated by
      # `pod install` and is not committed, so it has to be cached too.
      - name: Cache CocoaPods
        id: pods
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ios/fti_coach.xcworkspace
            ~/Library/Caches/CocoaPods
          key: pods-v2-${{ runner.os }}-${{ hashFiles('ios/Podfile', 'ios/Podfile.lock', 'package-lock.json') }}

      # A restored Pods project hardcodes the absolute path to the ccache binary
      # that existed when it was generated. If a runner image ever moves it, the
      # compile would fail with "command not found"; regenerate instead.
      - name: Check cached Pods project is still usable
        id: pods-check
        if: steps.pods.outputs.cache-hit == 'true'
        run: |
          binary=$(sed -n 's/.*CCACHE_BINARY = "\{0,1\}\([^";]*\)"\{0,1\};.*/\1/p' \
            ios/Pods/Pods.xcodeproj/project.pbxproj | head -1)
          if [ -n "$binary" ] && [ ! -x "$binary" ]; then
            echo "ccache moved from $binary; regenerating the Pods project"
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install CocoaPods dependencies
        if: steps.pods.outputs.cache-hit != 'true' || steps.pods-check.outputs.stale == 'true'
        working-directory: ios
        run: bundle exec pod install

      # Read-only deploy key used by fastlane match to clone the private
      # certificates repo over SSH.
      - name: Load certificates repo deploy key
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.CERTS_DEPLOY_KEY }}

      - name: Build, capture screenshots, upload and submit for review
        run: >
          bundle exec fastlane ios release
          bump:${{ inputs.bump }}
          version:${{ inputs.version }}
          submit_for_review:${{ inputs.submit_for_review }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          SCREENSHOT_EMAIL: ${{ secrets.SCREENSHOT_EMAIL }}
          SCREENSHOT_PASSWORD: ${{ secrets.SCREENSHOT_PASSWORD }}

      # Hit rate should settle well above 90% on runs that do not touch native
      # code; a sudden drop means something invalidated the cache (Xcode
      # upgrade, RN version bump, changed compiler flags).
      - name: Report ccache statistics
        if: always()
        run: ccache --show-stats --verbose || true

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: fastlane/screenshots
          if-no-files-found: ignore

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-build-log
          path: ~/Library/Logs/gym/*.log
          if-no-files-found: ignore
