name: iOS App Store Release

# Manually triggered: bumps the marketing version, builds, uploads, captures
# the App Store screenshots and submits the app for review. The version bump
# is committed back to the repository and tagged (vX.Y.Z).
#
# Split into three jobs because the device archive and the simulator build that
# drives the screenshots are independent full compiles of the same dependency
# graph; running them on separate machines halves the wall clock at the cost of
# a second runner. `publish` joins them back together.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type (ignored when an explicit version is given)
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: 'Explicit version (e.g. 1.2.0). Leave empty to use the bump type.'
        type: string
        required: false
      submit_for_review:
        description: 'Submit for App Store review after uploading. Set to false to do a dry run (build + screenshots uploaded, no submission).'
        type: boolean
        default: true

concurrency:
  group: ios-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build the App Store IPA
    runs-on: macos-26
    timeout-minutes: 90
    outputs:
      version: ${{ steps.build.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up iOS build environment
        uses: ./.github/actions/setup-ios-build
        with:
          # Device (iphoneos) objects — shared with the TestFlight workflow,
          # which compiles exactly the same configuration.
          ccache-key-prefix: ccache-ios-device

      # Read-only deploy key used by fastlane match to clone the private
      # certificates repo over SSH.
      - name: Load certificates repo deploy key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.CERTS_DEPLOY_KEY }}

      - name: Bump the version and build the IPA
        id: build
        run: |
          bundle exec fastlane ios build_release \
            bump:${{ inputs.bump }} \
            version:${{ inputs.version }}
          echo "version=$(cat build/version.txt)" >> "$GITHUB_OUTPUT"
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}

      - name: Report ccache statistics
        if: always()
        run: ccache --show-stats --verbose || true

      - name: Upload the IPA
        uses: actions/upload-artifact@v6
        with:
          name: ipa
          path: build/fti_coach.ipa
          retention-days: 14
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: xcode-build-log
          path: ~/Library/Logs/gym/*.log
          if-no-files-found: ignore

  screenshots:
    name: Capture App Store screenshots
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up iOS build environment
        uses: ./.github/actions/setup-ios-build
        with:
          # Simulator objects are a separate compile to the device archive, so
          # they need their own cache namespace: two jobs in the same run
          # cannot write the same cache key.
          ccache-key-prefix: ccache-ios-simulator

      # No signing and no match: this is a simulator build, so it needs neither
      # the certificates repo nor an App Store Connect key.
      - name: Capture screenshots
        run: bundle exec fastlane ios screenshots
        env:
          SCREENSHOT_EMAIL: ${{ secrets.SCREENSHOT_EMAIL }}
          SCREENSHOT_PASSWORD: ${{ secrets.SCREENSHOT_PASSWORD }}

      - name: Report ccache statistics
        if: always()
        run: ccache --show-stats --verbose || true

      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: screenshots
          path: fastlane/screenshots
          retention-days: 14
          if-no-files-found: ignore

      # snapshot tees the xcodebuild output to ~/Library/Logs/snapshot/ — the
      # only place a "No device found" / failed-assertion screenshot run is
      # visible. Upload it so a failed job is actually debuggable instead of
      # leaving a silently empty screenshots artifact.
      - name: Upload screenshot test log on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: screenshot-test-log
          path: ~/Library/Logs/snapshot/*.log
          retention-days: 14
          if-no-files-found: ignore

  publish:
    name: Upload, submit for review and tag
    needs: [build, screenshots]
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so the release commit/tag can be pushed back.
          fetch-depth: 0

      # No Xcode, Node or CocoaPods here: this job only rewrites the version in
      # the project file and talks to App Store Connect.
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Download the IPA
        uses: actions/download-artifact@v8
        with:
          name: ipa
          path: build

      - name: Download the screenshots
        uses: actions/download-artifact@v8
        with:
          name: screenshots
          path: fastlane/screenshots

      - name: Upload to App Store Connect and submit for review
        run: >
          bundle exec fastlane ios publish
          version:${{ needs.build.outputs.version }}
          submit_for_review:${{ inputs.submit_for_review }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
