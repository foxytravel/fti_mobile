name: Update Podfile.lock

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/Podfile'
      - 'package.json'
      - 'package-lock.json'

jobs:
  update-podfile-lock:
    name: Regenerate Podfile.lock
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Regenerate Podfile.lock
        working-directory: ios
        run: bundle exec pod install

      - name: Commit Podfile.lock
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add ios/Podfile.lock
          if ! git diff --cached --quiet; then
            git commit -m 'chore(ios): update Podfile.lock'
            git push
          else
            echo 'Podfile.lock is up to date'
          fi