name: Update Podfile.lock

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ios/Podfile'
      - 'package.json'
      - 'package-lock.json'

concurrency:
  group: ios-podfile-lock
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-podfile-lock:
    name: Regenerate Podfile.lock
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Regenerate Podfile.lock
        working-directory: ios
        run: bundle exec pod install

      - name: Commit Podfile.lock
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add ios/Podfile.lock
          if ! git diff --cached --quiet; then
            git commit -m 'chore(ios): update Podfile.lock'
            git push
          else
            echo 'Podfile.lock is up to date'
          fi
