name: Update Podfile.lock

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ios/Podfile'
      - 'package.json'
      - 'package-lock.json'

concurrency:
  group: ios-podfile-lock
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-podfile-lock:
    name: Regenerate Podfile.lock
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Cache node_modules
        id: node-modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install npm dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      # Only the pod download cache: this job exists to resolve the graph from
      # scratch, so `ios/Pods` itself is deliberately not restored.
      - name: Cache CocoaPods downloads
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/CocoaPods
          key: cocoapods-downloads-${{ runner.os }}-${{ hashFiles('ios/Podfile', 'package-lock.json') }}
          restore-keys: |
            cocoapods-downloads-${{ runner.os }}-

      - name: Regenerate Podfile.lock
        working-directory: ios
        run: bundle exec pod install

      - name: Commit Podfile.lock
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add ios/Podfile.lock
          if ! git diff --cached --quiet; then
            git commit -m 'chore(ios): update Podfile.lock'
            git push
          else
            echo 'Podfile.lock is up to date'
          fi
